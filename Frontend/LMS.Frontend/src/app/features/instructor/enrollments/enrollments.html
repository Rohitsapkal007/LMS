<div class="table-responsive">
    <table class="table table-hover table-striped align-middle">
        <thead class="table-light">
            <tr>
                <th>Course Title</th>
                <th>Total Enrollment</th>
                <th class="text-center">Actions</th>
            </tr>
        </thead>
        <tbody>
            @for (course of gridData$ | async; track course.courseId) {
            <tr>
                <td>{{ course.title }}</td>
                <td>{{ course.totalEnrollment }}</td>
                <td>
                    <div class="d-flex flex-wrap justify-content-center gap-2">
                        <button class="btn btn-secondary btn-sm" (click)="viewStudents(course.courseId)">View Students</button>
                        <button class="btn btn-success btn-sm btn-wide" (click)="exportData(course.courseId)">Export Report</button>
                    </div>
                </td>
            </tr>
            }
            @empty {
            <tr>
                <td colspan="9" class="text-center">No item to display</td>
            </tr>
            }
        </tbody>
    </table>
</div>
